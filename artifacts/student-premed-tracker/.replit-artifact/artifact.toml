kind = "web"
previewPath = "/"
title = "Student Pre-Med Tracker"
version = "1.0.0"
id = "artifacts/student-premed-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24921

[services.development]
run = "pnpm --filter @workspace/student-premed-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/student-premed-tracker", "run", "build" ]
publicDir = "artifacts/student-premed-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24921"
BASE_PATH = "/"
